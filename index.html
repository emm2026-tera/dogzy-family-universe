<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0905">
<title>The Adoles-chiant of Dogzy Town</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="title">THE ADOLES-CHIANT <span>of</span> DOGZY TOWN</div>
    <div class="stats">
      <div class="stat" title="Tokens"><i class="ico coin"></i><b id="hTokens">0</b></div>
      <div class="stat" title="Accessories"><i class="ico gem"></i><b id="hAcc">0</b></div>
      <div class="stat" title="Shield"><i class="ico shield"></i><b id="hShield">OFF</b></div>
      <div class="stat" title="Level"><i class="ico lvl"></i><b id="hLevel">1</b></div>
    </div>
    <div class="substats"><span id="hMult"></span><span id="hRival"></span><span id="hTurn"></span></div>
  </header>

  <main id="boardWrap">
    <div id="board">
      <img id="boardImg" src="assets/board-level1.png" alt="Dogzy Town Level 1 board" draggable="false">
      <div id="wpLayer"></div>
      <div id="pawn"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="url(#pg)" stroke="#fff3c4" stroke-width="3"/><defs><radialGradient id="pg" cx="35%" cy="30%"><stop offset="0" stop-color="#fff1a8"/><stop offset=".55" stop-color="#d4a017"/><stop offset="1" stop-color="#7a5200"/></radialGradient></defs><g fill="#140e02"><ellipse cx="32" cy="40" rx="11" ry="9"/><ellipse cx="19" cy="27" rx="5" ry="6.5"/><ellipse cx="27" cy="19" rx="5" ry="6.5"/><ellipse cx="37" cy="19" rx="5" ry="6.5"/><ellipse cx="45" cy="27" rx="5" ry="6.5"/></g></svg></div>
    </div>
  </main>

  <div id="log"></div>

  <nav id="controls">
    <button class="btn ghost" id="btnLevels">LEVELS</button>
    <button class="btn spin" id="btnSpin">SPIN</button>
    <button class="btn ghost" id="btnBag">BAG</button>
  </nav>
</div>

<!-- generic modal -->
<div id="modal" class="hidden">
  <div class="sheet" id="sheet"></div>
</div>
<div id="toast"></div>

<script src="data.js"></script>
<script src="game.js"></script>
</body>
</html>
