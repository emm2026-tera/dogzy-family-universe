<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0905">
<!-- Shared assets: every relative path (style.css, data.js, chars.js, assets/…) resolves to the site root. -->
<base href="../">
<title>Dogzy Family Universe</title>
<link rel="stylesheet" href="style.css">
<link rel="alternate" hreflang="fr" href="../">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="title">DOGZY <span>Family</span> UNIVERSE</div>
    <nav class="langSw" aria-label="Language"><a href="./" hreflang="fr" lang="fr">FR</a><b>EN</b></nav>
    <div class="stats">
      <div class="stat" title="Coins"><i class="ico coin"></i><b id="hTokens">0</b></div>
      <div class="stat dzs" title="Dogzy tokens"><i class="ico dz"></i><b id="hDogzy">0</b></div>
      <div class="stat gds" title="Gold accessories (single use each)"><span class="gstar">✦</span><b id="hGold">0</b></div>
      <div class="stat" title="Accessories"><i class="ico gem"></i><b id="hAcc">0</b></div>
      <div class="stat" title="Shield"><i class="ico shield"></i><b id="hShield">NO</b></div>
      <div class="stat" title="Level"><i class="ico lvl"></i><b id="hLevel">1</b></div>
    </div>
    <div class="substats"><span id="hMult"></span><span id="hGoal"></span><span id="hTurn"></span></div>
    <div id="leader" aria-label="Leaderboard"></div>
  </header>

  <main id="boardWrap">
    <div id="board">
      <img id="boardImg" src="assets/board-level1.png" alt="Dogzy Town game board" draggable="false">
      <div id="wpLayer"></div>
      <div id="pawns"></div>
    </div>
  </main>

  <div id="botPanel" class="hidden"><img id="bpImg" alt=""><div class="bpText"><b id="bpName"></b><span id="bpMsg"></span></div><div id="bpWheel"></div><button class="btn" id="bpSkip">SKIP ⏭</button></div>
  <div id="log"></div>

  <nav id="controls">
    <button class="btn ghost" id="btnLevels">LEVELS</button>
    <button class="btn spin" id="btnSpin">SPIN</button>
    <button class="btn ghost" id="btnBag">BAG</button>
    <button class="btn ghost shop" id="btnShop">🛍</button>
    <button class="btn ghost speed" id="btnSpeed" title="Bot speed">1x</button>
  </nav>
</div>

<!-- generic modal -->
<div id="modal" class="hidden">
  <div class="sheet" id="sheet"></div>
</div>
<div id="toast"></div>

<script src="data.js"></script>
<script src="en/strings-en.js"></script>
<script src="chars.js"></script>
<script src="en/chars-en.js"></script>
<script src="en/game.js"></script>
</body>
</html>
